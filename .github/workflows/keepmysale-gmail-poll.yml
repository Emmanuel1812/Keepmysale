name: Keepmysale Gmail poll

# Vercel Hobby only runs one cron per day. GitHub runs this every 5 minutes (best effort, it can lag a few minutes).
# Needs ONE repository secret: CRON_SECRET (the same value as the CRON_SECRET env var in Vercel).
# Without the secret the job skips itself, so it never fails noisily.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the polling endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X GET "https://keepmysale.com/api/cron/check-gmail" \
            -H "Authorization: Bearer $CRON_SECRET"
