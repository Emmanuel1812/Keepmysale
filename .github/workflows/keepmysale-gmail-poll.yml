name: Keepmysale Gmail poll

# Vercel Hobby only runs one cron per day. GitHub runs this every 5 minutes (best effort, it can lag a few minutes).
# No secret needed: the job proves who it is with a GitHub-signed OIDC token, which the app verifies
# (saas-platform/src/lib/github-oidc.ts: this repository, this workflow, the production branch, schedule or manual).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the polling endpoint
        run: |
          TOKEN=$(curl -sS --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=keepmysale-cron" | jq -r .value)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Could not get a GitHub OIDC token"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X GET "https://keepmysale.com/api/cron/check-gmail" \
            -H "Authorization: Bearer $TOKEN"
